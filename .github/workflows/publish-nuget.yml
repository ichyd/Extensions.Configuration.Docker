name: Publish NuGet package
 
on:
  pull_request:
    branches: [main]
    paths: &paths
      - 'src/**'
      - 'README.md'
      - 'LICENSE'
      - '.github/workflows/publish-nuget.yml'
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:
 
permissions:
  contents: read
 
env:
  SOLUTION: src/Extensions.Configuration.Docker.slnx
  PROJECT: src/lib/Extensions.Configuration.Docker/Extensions.Configuration.Docker.csproj
  NUGET_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
  DOTNET_NOLOGO: true
 
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
 
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }} --locked-mode
 
      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore
 
      - name: Test
        run: dotnet test ${{ env.SOLUTION }} -c Release --no-build --verbosity normal
 
      - name: Pack
        run: dotnet pack ${{ env.PROJECT }} -c Release --no-build -o ./artifacts
 
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./artifacts/*.nupkg
          if-no-files-found: error
 
  publish:
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: ./artifacts
 
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
 
      - name: Push to GitHub Packages
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --source ${{ env.NUGET_SOURCE }}
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
 
